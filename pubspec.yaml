name: denizen_ai
description: Privacy-first, on-device multimodal AI engine for Flutter. Run local LLMs, Vector RAG, and structured tool calling 100% offline.
version: 0.1.0-dev.1
homepage: https://github.com/Ubuntu-Edge/denizen_ai_os
repository: https://github.com/Ubuntu-Edge/denizen_ai_os
issue_tracker: https://github.com/Ubuntu-Edge/denizen_ai_os/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.10.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  http: ^1.6.0
  connectivity_plus: ^6.1.5
  tflite_flutter: ^0.12.1
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.42
  path: ^1.9.1
  record: ^6.2.1
  whisper_flutter_new: ^1.0.1
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    platforms:
      android:
        package: com.agilebiz.denizen_ai
        pluginClass: DenizenAiPlugin
  assets:
    - assets/models/
